services:
  jembex-dedupe:
    image: ghcr.io/aerowinder/jembex-dedupe:latest
    container_name: jembex-dedupe
    ports:
      - "3369:80"
    environment:
      - PUID=1000   # owner of ./config on the host (Unraid: 99)
      - PGID=1000   # (Unraid: 100)
      # - ALLOWED_HOSTS=nas.lan,192.168.1.10   # optional: names/addresses you open the app by
    volumes:
      - ./config:/config   # one file per server: URL, API key and ignore list
    restart: unless-stopped
